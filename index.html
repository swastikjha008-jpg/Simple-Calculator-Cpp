<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>React Calculator v2</title>

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121212;
      color: white;
    }

    .calculator {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .display {
      width: 100%;
      height: 60px;
      font-size: 24px;
      margin-bottom: 10px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #000;
      color: #0f0;
      text-align: right;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .controls button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #ff4d4d;
      color: white;
      cursor: pointer;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [input, setInput] = React.useState("");

      const handleClick = (value) => {
        setInput((prev) => prev + value);
      };

      const clearInput = () => setInput("");

      const deleteLast = () => {
        setInput((prev) => prev.slice(0, -1));
      };

      const calculate = () => {
        try {
          const result = eval(input);
          setInput(result.toString());
        } catch {
          setInput("Error");
        }
      };

      const buttons = [
        "7", "8", "9", "/",
        "4", "5", "6", "*",
        "1", "2", "3", "-",
        "0", ".", "=", "+"
      ];

      return (
        <div className="calculator">
          <h2>React Calculator</h2>

          <input
            type="text"
            value={input}
            readOnly
            className="display"
          />

          <div className="controls">
            <button onClick={clearInput}>C</button>
            <button onClick={deleteLast}>DEL</button>
          </div>

          <div className="buttons">
            {buttons.map((btn) => (
              <button
                key={btn}
                onClick={() =>
                  btn === "=" ? calculate() : handleClick(btn)
                }
              >
                {btn}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
